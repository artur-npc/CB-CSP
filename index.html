
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Strict CSP: style-src has NO 'unsafe-inline'.
       The page's own <style>/<script> use a nonce; anything the banner does
       with inline styles gets blocked and reported. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'nonce-cbCspTest' https://dev-consent-cookiebot-com.cookiebot.dev;
    style-src   'self' 'nonce-cbCspTest';
    img-src     'self' data: blob: https://*.cookiebot.dev https://*.cookiebot.com;
    font-src    'self' data: https://*.cookiebot.dev https://*.cookiebot.com;
    connect-src 'self' https://*.cookiebot.dev https://*.cookiebot.com;
    frame-src   'self' https://*.cookiebot.dev https://*.cookiebot.com;
  " />

  <title>style-src check (EUD-3489)</title>

  <!-- Catch style violations before the banner loads. -->
  <script nonce="cbCspTest">
    window.__style = [];
    document.addEventListener('securitypolicyviolation', function (e) {
      var dir = e.effectiveDirective || e.violatedDirective || '';
      if (dir.indexOf('style') === 0) {
        window.__style.push({
          dir: dir,
          what: e.sample || e.blockedURI || 'inline',
          src: (e.sourceFile || '') + (e.lineNumber ? ':' + e.lineNumber : '')
        });
        if (window.__refresh) window.__refresh();
      }
    });
  </script>

  <script
    id="Cookiebot"
    src="https://dev-consent-cookiebot-com.cookiebot.dev/uc.js"
    data-cbid="5d0450b1-716d-4cf5-b0b1-d11523ff6b37"
    data-blockingmode="auto"
    type="text/javascript"
    data-culture="en"
    nonce="cbCspTest"></script>

  <style nonce="cbCspTest">
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 640px; margin: 48px auto; padding: 20px; background: #f8fafc; color: #1e293b; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #64748b; font-size: 14px; margin: 0 0 20px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    button { background: #6d28d9; color: #fff; border: none; padding: 9px 16px;
      border-radius: 7px; cursor: pointer; font-size: 14px; }
    button.danger { background: #ef4444; }
    .verdict { padding: 16px; border-radius: 8px; font-size: 17px; font-weight: 700; text-align: center; }
    .verdict.pass { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .verdict.fail { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .verdict.idle { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    ul { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #b91c1c;
      margin-top: 12px; padding-left: 18px; }
    li { margin: 4px 0; word-break: break-word; }
  </style>
</head>
<body>
  <h1>style-src compliance check</h1>
  <p class="sub">Loads the Cookiebot banner under a CSP with no <code>'unsafe-inline'</code>
    for styles and counts <code>style-src</code> violations. EUD-3489.</p>

  <div class="actions">
    <button id="renew">Open / renew banner</button>
    <button id="reset" class="danger">Reset consent cookie</button>
  </div>

  <div class="verdict idle" id="verdict">Open the banner to run the check.</div>
  <ul id="log"></ul>

  <script nonce="cbCspTest">
    var verdict = document.getElementById('verdict');
    var log = document.getElementById('log');

    function refresh() {
      var v = window.__style;
      var rendered = !!document.getElementById('CybotCookiebotDialog');

      log.textContent = '';
      v.forEach(function (row) {
        var li = document.createElement('li');
        li.textContent = row.dir + ' — ' + row.what + (row.src ? '  (' + row.src + ')' : '');
        log.appendChild(li);
      });

      if (v.length > 0) {
        verdict.className = 'verdict fail';
        verdict.textContent = 'FAIL — ' + v.length + ' style-src violation' + (v.length === 1 ? '' : 's');
      } else if (rendered) {
        verdict.className = 'verdict pass';
        verdict.textContent = 'PASS — banner rendered, 0 style-src violations';
      } else {
        verdict.className = 'verdict idle';
        verdict.textContent = 'Banner not rendered yet — open / renew it.';
      }
    }
    window.__refresh = refresh;

    function renew() {
      if (window.Cookiebot && Cookiebot.renew) Cookiebot.renew();
      else if (window.Cookiebot && Cookiebot.show) Cookiebot.show();
      setTimeout(refresh, 250);
    }

    document.getElementById('renew').addEventListener('click', renew);
    document.getElementById('reset').addEventListener('click', function () {
      document.cookie = 'CookieConsent=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
      renew();
    });

    window.addEventListener('CookiebotOnDialogDisplay', function () { setTimeout(refresh, 80); });
    window.addEventListener('CookiebotOnLoad', function () { setTimeout(refresh, 150); });
    setInterval(refresh, 1500);
    refresh();
  </script>
</body>
</html>
